name: Deploy MkDocs

on:
  push:
    branches:
      - main  # Trigger workflow on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    env: 
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # The GitHub Token will be handled automatically

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs mkdocs-material

      - name: Build the MkDocs site
        run: |
          mkdocs build  # Build the site without deploying yet

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force  # Deploy to gh-pages
